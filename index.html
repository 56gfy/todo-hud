<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>任务控制台 / TODO HUD</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:#080b0d;
  color:#d5e2e0;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;
  background-image:
    linear-gradient(rgba(0,240,200,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,200,.055) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 15%,transparent 100%);
  mask-image:radial-gradient(ellipse 95% 75% at 50% 0%,#000 15%,transparent 100%);
}
.scan{
  position:fixed;left:0;right:0;top:0;height:150px;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,240,200,0) 0%,rgba(0,240,200,.05) 48%,rgba(0,240,200,.09) 52%,rgba(0,240,200,0) 100%);
  animation:scanMove 9s linear infinite;
  will-change:transform;
}
@keyframes scanMove{from{transform:translateY(-150px)}to{transform:translateY(100vh)}}

.frame{position:fixed;inset:12px;z-index:3;pointer-events:none}
.frame span{position:absolute;width:22px;height:22px;border:0 solid rgba(0,240,200,.45)}
.frame span:nth-child(1){top:0;left:0;border-top-width:1px;border-left-width:1px}
.frame span:nth-child(2){top:0;right:0;border-top-width:1px;border-right-width:1px}
.frame span:nth-child(3){bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}
.frame span:nth-child(4){bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}

.shell{
  position:relative;z-index:2;max-width:860px;margin:0 auto;
  padding:clamp(22px,4vw,42px) clamp(14px,3vw,28px) 52px;
}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.led{width:7px;height:7px;flex:none;background:#00f0c8;box-shadow:0 0 8px rgba(0,240,200,.65);animation:ledPulse 2.8s ease-in-out infinite}
@keyframes ledPulse{0%,100%{opacity:1}50%{opacity:.35}}
.brand-t{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;letter-spacing:.22em;color:#00f0c8;white-space:nowrap}
.brand-s{color:#3a4a48;margin:0 5px}
.tag{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:9.5px;letter-spacing:.16em;color:#546865;border:1px solid rgba(255,255,255,.08);padding:3px 6px;white-space:nowrap}
.clock{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;letter-spacing:.1em;color:#5b6e6c;white-space:nowrap}

.board{border:1px solid rgba(255,255,255,.08);background:#0b1013;padding:14px 14px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(0,240,200,.13);border:1px solid rgba(255,255,255,.06)}
.stat{background:#0b1013;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.stat .k{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:9.5px;letter-spacing:.2em;color:#5b6e6c;white-space:nowrap}
.stat .v{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:22px;line-height:1;color:#dbe8e6;font-weight:500}
.stat .v.is-done{color:#00f0c8}
.stat .v.is-left{color:#ffb020}

.meter{margin-top:14px}
.meter-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.meter-head .lbl{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:9.5px;letter-spacing:.2em;color:#5b6e6c}
#pct{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;letter-spacing:.06em;color:#00f0c8}
.track{position:relative;height:6px;background:#0e1518;border:1px solid rgba(0,240,200,.16);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,rgba(0,240,200,.5),#00f0c8);transition:width .35s cubic-bezier(.4,0,.2,1)}
.track::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(8,11,13,.92) calc(10% - 1px) 10%)}

.composer{margin-top:12px}
.field{
  flex:1 1 auto;min-width:0;display:flex;align-items:center;
  background:#0b1013;border:1px solid rgba(255,255,255,.1);padding-left:12px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.field:focus-within{border-color:rgba(0,240,200,.8);box-shadow:0 0 0 1px rgba(0,240,200,.16),0 0 16px -6px rgba(0,240,200,.5)}
.field.is-warn{border-color:rgba(255,176,32,.8);box-shadow:0 0 0 1px rgba(255,176,32,.16)}
.field .pre{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:#00f0c8;flex:none}
#input{
  flex:1 1 auto;min-width:0;height:46px;padding:0 10px 0 8px;
  background:transparent;border:0;outline:none;
  color:#e2efed;caret-color:#00f0c8;
  font:14px/1.4 "PingFang SC","Microsoft YaHei",sans-serif;
}
#input::placeholder{color:#4d605e}
#btnAdd{
  flex:none;width:44px;height:46px;margin-left:4px;display:grid;place-items:center;cursor:pointer;
  background:rgba(0,240,200,.08);border:0;border-left:1px solid rgba(0,240,200,.22);color:#00f0c8;
  transition:background .18s ease,color .18s ease;
}
#btnAdd:hover{background:rgba(0,240,200,.2)}

.filters{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{
  flex:0 0 auto;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,.08);color:#8ba09e;
  font:13px/1 "PingFang SC","Microsoft YaHei",sans-serif;
  transition:color .16s ease,border-color .16s ease,background .16s ease;
}
.tab .n{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;color:#5b6e6c}
.tab:hover{color:#c8d8d6;border-color:rgba(255,255,255,.16)}
.tab[aria-pressed="true"]{border-color:rgba(0,240,200,.6);color:#00f0c8;background:rgba(0,240,200,.06)}
.tab[aria-pressed="true"] .n{color:#00f0c8}

.list{list-style:none;margin:12px 0 0;padding:0;border:1px solid rgba(255,255,255,.08);background:#0a0f12}
.item{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 0;border-bottom:1px solid rgba(255,255,255,.055);position:relative}
.item:last-child{border-bottom:0}
.item:hover,.item:focus-within{background:#101a1e}
.idx{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:10px;color:#556967;width:22px;text-align:right;flex:none;user-select:none}
.txt{
  flex:1 1 auto;min-width:0;padding:11px 6px;font-size:15px;line-height:1.55;
  color:#dae7e5;overflow-wrap:anywhere;cursor:text;
}
.txt:focus-visible{outline:1px dashed rgba(0,240,200,.65);outline-offset:-6px}
.item.done .txt{color:#5c716f;text-decoration:line-through;text-decoration-color:rgba(0,240,200,.45);text-decoration-thickness:1px}
.check{
  width:44px;height:44px;flex:none;padding:0;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:0;color:#00f0c8;
}
.check .box{
  width:19px;height:19px;display:grid;place-items:center;
  border:1px solid rgba(0,240,200,.42);background:#0a0f12;
  transition:border-color .16s ease,background .16s ease;
}
.check:hover .box{border-color:rgba(0,240,200,.9)}
.item.done .box{border-color:#00f0c8;background:rgba(0,240,200,.14)}
.check svg{opacity:0}
.check svg path{stroke-dasharray:15;stroke-dashoffset:15}
.item.done .check svg{opacity:1}
.item.done .check svg path{stroke-dashoffset:0;transition:stroke-dashoffset .24s ease-out}
.item.flash .box{animation:powerOn .26s ease-out}
@keyframes powerOn{
  0%{background:#00f0c8;box-shadow:0 0 0 0 rgba(0,240,200,.55)}
  55%{box-shadow:0 0 0 5px rgba(0,240,200,0)}
  100%{box-shadow:0 0 0 0 rgba(0,240,200,0)}
}
.del{
  width:44px;height:44px;flex:none;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:0;color:#6b7e7c;opacity:0;
  transition:opacity .15s ease,color .15s ease;
}
.item:hover .del,.item:focus-within .del{opacity:1}
.del:hover{color:#ffb020}
.del:focus-visible{opacity:1}

.edit{
  flex:1 1 auto;min-width:0;padding:8px;margin:2px 0;
  background:#0f171a;border:1px solid rgba(0,240,200,.65);outline:none;
  color:#e6f2f0;font:14.5px/1.55 "PingFang SC","Microsoft YaHei",sans-serif;
}

.empty{margin-top:12px;padding:34px 16px;text-align:center;border:1px dashed rgba(0,240,200,.22);background:rgba(0,240,200,.02)}
.empty .t1{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;letter-spacing:.22em;color:rgba(0,240,200,.8)}
.empty .t2{margin:10px 0 0;font-size:13px;color:#6d807e;line-height:1.6}

.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:9.5px;letter-spacing:.16em;color:#4b5d5b}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.hint{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:10.5px;letter-spacing:.06em;color:#4b5d5b;line-height:1.6}
#btnClear{
  min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,176,32,.35);color:#ffb020;
  font:12.5px/1 "PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
#btnClear:hover:not(:disabled){background:rgba(255,176,32,.1);border-color:rgba(255,176,32,.7)}
#btnClear:disabled{color:#4a5754;border-color:rgba(255,255,255,.07);cursor:not-allowed}

:focus-visible{outline:2px solid rgba(0,240,200,.75);outline-offset:2px}
#input:focus-visible{outline:none}
.edit:focus-visible{outline:none;border-color:#00f0c8}

@media (hover:none){
  .del{opacity:.8}
}
@media (max-width:520px){
  .tag{display:none}
  .stat .v{font-size:19px}
  .stat{padding:9px 10px}
  .clock{font-size:10px;letter-spacing:.06em}
  .shell{padding-bottom:44px}
  .hint{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .scan{display:none}
}
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="frame" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<main class="shell">
  <header class="top">
    <div class="brand">
      <span class="led" aria-hidden="true"></span>
      <span class="brand-t">TASK<span class="brand-s">/</span>HUD</span>
      <span class="tag">SYSTEM ONLINE</span>
    </div>
    <div class="clock mono" id="clock">00:00:00</div>
  </header>

  <section class="board" aria-label="任务统计">
    <div class="stats">
      <div class="stat"><span class="k">TOTAL</span><span class="v mono" id="statTotal">0</span></div>
      <div class="stat"><span class="k">DONE</span><span class="v mono is-done" id="statDone">0</span></div>
      <div class="stat"><span class="k">LEFT</span><span class="v mono is-left" id="statLeft">0</span></div>
    </div>
    <div class="meter">
      <div class="meter-head"><span class="lbl">PROGRESS</span><span id="pct">0%</span></div>
      <div class="track" id="track" role="progressbar" aria-label="完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
    </div>
  </section>

  <form class="composer" id="form" autocomplete="off">
    <div class="field" id="field">
      <span class="pre" aria-hidden="true">&gt;</span>
      <input id="input" type="text" maxlength="120" placeholder="输入任务，回车添加" aria-label="任务内容">
    <button id="btnAdd" type="submit" aria-label="添加任务">
      <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true" focusable="false"><path d="M9 3.5v11M3.5 9h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>
    </button>
    </div>
  </form>

  <div class="filters" role="group" aria-label="筛选任务">
    <button class="tab" type="button" data-filter="all" aria-pressed="true">全部<span class="n mono">0</span></button>
    <button class="tab" type="button" data-filter="active" aria-pressed="false">进行中<span class="n mono">0</span></button>
    <button class="tab" type="button" data-filter="done" aria-pressed="false">已完成<span class="n mono">0</span></button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="empty" id="empty">
    <div class="t1" id="emptyTitle">[ 暂无任务 ]</div>
    <p class="t2" id="emptyText">在上面输入一条任务，回车即创建。</p>
  </div>

  <div class="foot">
    <span class="hint">双击任务可编辑 / 回车保存 / Esc 取消</span>
    <button id="btnClear" type="button" disabled>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path d="M3 4.6h10M6.4 4.6V3h3.2v1.6M4.4 4.6 5 13.2h6l.6-8.6M6.6 7v3.6M9.4 7v3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>
      清空已完成
    </button>
  </div>

  <div class="statusbar" aria-hidden="true">
    <span>DATA · LOCAL</span>
    <span id="saveInfo">SAVED · 0</span>
  </div>

  <p class="sr" id="sr" aria-live="polite"></p>
</main>

<script>
(function () {
  'use strict';

  var KEY = 'hud.todos.v1';
  var state = { tasks: [], filter: 'all', flash: null };
  var el = {};
  var warnTimer = 0;
  var storeOk = true;

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function readStore() {
    var raw;
    try {
      raw = localStorage.getItem(KEY);
    } catch (e) {
      storeOk = false;
      return [];
    }
    if (!raw) return [];
    try {
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return [];
      var out = [];
      for (var i = 0; i < arr.length; i++) {
        var t = arr[i];
        if (!t || typeof t.text !== 'string') continue;
        var text = t.text.trim();
        if (!text) continue;
        out.push({ id: String(t.id || uid()), text: text.slice(0, 120), done: !!t.done });
      }
      return out;
    } catch (e) {
      return [];
    }
  }

  function saveStore() {
    if (!storeOk) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(state.tasks));
    } catch (e) {
      storeOk = false;
    }
  }

  function svgCheck() {
    return '<span class="box"><svg viewBox="0 0 18 18" width="14" height="14" aria-hidden="true" focusable="false">' +
      '<path d="M3.6 9.6 7.2 13.2 14.4 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg></span>';
  }

  function buildRow(task, index) {
    var li = document.createElement('li');
    li.className = 'item' + (task.done ? ' done' : '') + (state.flash === task.id ? ' flash' : '');
    li.setAttribute('data-id', task.id);

    var chk = document.createElement('button');
    chk.type = 'button';
    chk.className = 'check';
    chk.setAttribute('role', 'checkbox');
    chk.setAttribute('aria-checked', task.done ? 'true' : 'false');
    chk.setAttribute('aria-label', (task.done ? '取消完成：' : '标记完成：') + task.text);
    chk.innerHTML = svgCheck();
    chk.addEventListener('click', function () { toggle(task.id); });

    var idx = document.createElement('span');
    idx.className = 'idx mono';
    idx.setAttribute('aria-hidden', 'true');
    idx.textContent = ('0' + (index + 1)).slice(-2);

    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.tabIndex = 0;
    txt.textContent = task.text;
    txt.setAttribute('aria-label', '任务：' + task.text + '，双击或按回车编辑');
    txt.addEventListener('dblclick', function () { startEdit(li, task); });
    txt.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === 'F2') {
        e.preventDefault();
        startEdit(li, task);
      }
    });

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.setAttribute('aria-label', '删除：' + task.text);
    del.innerHTML = '<svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true" focusable="false">' +
      '<path d="M3.4 5h11.2M7.2 5V3.4h3.6V5M5 5l.7 9.6h6.6L13 5M7.4 7.6v4.4M10.6 7.6v4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"/></svg>';
    del.addEventListener('click', function () { remove(task.id); });

    li.appendChild(chk);
    li.appendChild(idx);
    li.appendChild(txt);
    li.appendChild(del);
    return li;
  }

  function render() {
    var total = state.tasks.length;
    var done = 0;
    for (var i = 0; i < total; i++) if (state.tasks[i].done) done++;
    var left = total - done;
    var pct = total ? Math.round(done / total * 100) : 0;

    el.total.textContent = total;
    el.done.textContent = done;
    el.left.textContent = left;
    el.pct.textContent = pct + '%';
    el.fill.style.width = pct + '%';
    el.track.setAttribute('aria-valuenow', String(pct));

    el.tabs.all.querySelector('.n').textContent = total;
    el.tabs.active.querySelector('.n').textContent = left;
    el.tabs.done.querySelector('.n').textContent = done;
    el.tabs.all.setAttribute('aria-pressed', state.filter === 'all' ? 'true' : 'false');
    el.tabs.active.setAttribute('aria-pressed', state.filter === 'active' ? 'true' : 'false');
    el.tabs.done.setAttribute('aria-pressed', state.filter === 'done' ? 'true' : 'false');

    var shown = state.tasks.filter(function (t) {
      if (state.filter === 'done') return t.done;
      if (state.filter === 'active') return !t.done;
      return true;
    });

    el.list.textContent = '';
    for (var j = 0; j < shown.length; j++) {
      el.list.appendChild(buildRow(shown[j], j));
    }

    el.list.hidden = shown.length === 0;
    el.empty.hidden = shown.length !== 0;
    el.emptyTitle.textContent = total ? '[ 该分类下暂无任务 ]' : '[ 暂无任务 ]';
    el.emptyText.textContent = total ? '切到“全部”看看，或在上面新加一条。' : '在上面输入一条任务，回车即创建。';

    el.clear.disabled = done === 0;
    el.saveInfo.textContent = 'SAVED · ' + total + ' 项';
    el.sr.textContent = '共 ' + total + ' 条，已完成 ' + done + ' 条，剩余 ' + left + ' 条';
    state.flash = null;
  }

  function toggle(id) {
    var keepFocus = document.activeElement && document.activeElement.classList
      && document.activeElement.classList.contains('check');
    for (var i = 0; i < state.tasks.length; i++) {
      if (state.tasks[i].id === id) {
        state.tasks[i].done = !state.tasks[i].done;
        state.flash = id;
      }
    }
    saveStore();
    render();
    if (keepFocus) {
      var again = el.list.querySelector('.item[data-id="' + id + '"] .check');
      if (again) again.focus({ preventScroll: true });
    }
  }

  function remove(id) {
    state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
    saveStore();
    render();
  }

  function warnEmpty() {
    el.field.classList.add('is-warn');
    clearTimeout(warnTimer);
    warnTimer = setTimeout(function () { el.field.classList.remove('is-warn'); }, 520);
    el.input.focus();
  }

  function addTask() {
    var v = el.input.value.replace(/\s+/g, ' ').trim();
    if (!v) { warnEmpty(); return; }
    state.tasks.unshift({ id: uid(), text: v.slice(0, 120), done: false });
    el.input.value = '';
    if (state.filter === 'done') state.filter = 'all';
    saveStore();
    render();
    el.input.focus();
  }

  function startEdit(li, task) {
    var span = li.querySelector('.txt');
    if (!span) return;
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'edit';
    input.maxLength = 120;
    input.value = task.text;
    input.setAttribute('aria-label', '编辑任务内容');
    span.replaceWith(input);
    input.focus();
    input.select();

    var closed = false;
    function finish(save) {
      if (closed) return;
      closed = true;
      if (save) {
        var v = input.value.replace(/\s+/g, ' ').trim();
        if (v) task.text = v.slice(0, 120);
      }
      saveStore();
      render();
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', function () { finish(true); });
  }

  function tick() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    el.clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function init() {
    el.input = document.getElementById('input');
    el.form = document.getElementById('form');
    el.field = document.getElementById('field');
    el.list = document.getElementById('list');
    el.empty = document.getElementById('empty');
    el.emptyTitle = document.getElementById('emptyTitle');
    el.emptyText = document.getElementById('emptyText');
    el.total = document.getElementById('statTotal');
    el.done = document.getElementById('statDone');
    el.left = document.getElementById('statLeft');
    el.pct = document.getElementById('pct');
    el.fill = document.getElementById('fill');
    el.track = document.getElementById('track');
    el.clear = document.getElementById('btnClear');
    el.sr = document.getElementById('sr');
    el.clock = document.getElementById('clock');
    el.saveInfo = document.getElementById('saveInfo');
    el.tabs = {
      all: document.querySelector('[data-filter="all"]'),
      active: document.querySelector('[data-filter="active"]'),
      done: document.querySelector('[data-filter="done"]')
    };

    state.tasks = readStore();

    el.field.addEventListener('pointerdown', function (e) {
      if (e.target === el.field || e.target.className === 'pre') el.input.focus();
    });

    el.form.addEventListener('submit', function (e) {
      e.preventDefault();
      addTask();
    });

    el.tabs.all.addEventListener('click', function () { state.filter = 'all'; render(); });
    el.tabs.active.addEventListener('click', function () { state.filter = 'active'; render(); });
    el.tabs.done.addEventListener('click', function () { state.filter = 'done'; render(); });

    el.clear.addEventListener('click', function () {
      state.tasks = state.tasks.filter(function (t) { return !t.done; });
      saveStore();
      render();
    });

    tick();
    setInterval(tick, 1000);
    render();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
